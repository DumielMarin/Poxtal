<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poxtal</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/vendor/leaflet.min.css">
  <style>
    body { font-family: sans-serif; margin:0; padding:16px; }
    #map { height: 60vh; border-radius:12px; margin-top:12px; border:1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Poxtal</h1>
  <p>Fuentes y mapa conectados.</p>
  <div id="map"></div>

  <script src="js/vendor/leaflet.min.js"></script>
  <script src="js/vendor/jsQR.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script>
    const map = L.map('map').setView([41.3851, 2.1734], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);
  </script>
</body>
</html>
